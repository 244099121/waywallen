name: Build Arch Linux packages

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: 安装基础依赖
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git cmake ninja sudo

      - name: 创建编译用户
        run: |
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ***\n' >> /etc/sudoers
          chown -R builder:builder .

      - name: 预装 waywallen 依赖
        run: |
          pacman -S --noconfirm ffmpeg mesa vulkan-icd-loader \
            qt6-base qt6-declarative qt6-grpc libpipewire \
            curl sqlite libgcc libstdc++ glibc

      - name: 编译 waywallen
        run: |
          su builder -c "
            cd /tmp
            git clone https://aur.archlinux.org/waywallen.git
            cd waywallen
            makepkg -s --noconfirm
          "
        timeout-minutes: 30

      - name: 安装 waywallen
        run: |
          pacman -U --noconfirm /tmp/waywallen/waywallen-*.pkg.tar.zst

      - name: 编译 waywallen-display
        run: |
          su builder -c "
            cd /tmp
            git clone https://aur.archlinux.org/waywallen-display.git
            cd waywallen-display
            makepkg -s --noconfirm
          "
        timeout-minutes: 15

      - name: 安装 waywallen-display
        run: |
          pacman -U --noconfirm /tmp/waywallen-display/waywallen-display-*.pkg.tar.zst
          pacman -U --noconfirm /tmp/waywallen-display/plasma-wallpaper-waywallen-*.pkg.tar.zst || true

      - name: 安装 open-wallpaper-engine 编译依赖
        run: |
          pacman -S --noconfirm argparse eigen3 glad glfw nlohmann-json

      - name: 编译 open-wallpaper-engine
        run: |
          su builder -c "
            cd /tmp
            git clone https://aur.archlinux.org/open-wallpaper-engine.git
            cd open-wallpaper-engine
            makepkg -s --noconfirm
          "
        timeout-minutes: 30

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: |
            /tmp/waywallen/waywallen-*.pkg.tar.zst
            /tmp/waywallen-display/*.pkg.tar.zst
            /tmp/open-wallpaper-engine/open-wallpaper-engine-*.pkg.tar.zst
