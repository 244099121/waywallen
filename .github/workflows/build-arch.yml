name: Build Arch Linux packages

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git cmake ninja sudo

      - name: Setup build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Build waywallen
        run: |
          su builder -c "
            cd /tmp
            git clone https://aur.archlinux.org/waywallen.git
            cd waywallen
            # 用 makepkg -s 自动装依赖
            makepkg -s --noconfirm
          "
        timeout-minutes: 30

      - name: Install waywallen
        run: |
          pacman -U --noconfirm /tmp/waywallen/waywallen-*.pkg.tar.zst

      - name: Build open-wallpaper-engine
        run: |
          su builder -c "
            cd /tmp
            git clone https://aur.archlinux.org/open-wallpaper-engine.git
            cd open-wallpaper-engine
            # waywallen>=0.1.5 已满足
            makepkg -s --noconfirm
          "
        timeout-minutes: 30

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: |
            /tmp/waywallen/waywallen-*.pkg.tar.zst
            /tmp/open-wallpaper-engine/open-wallpaper-engine-*.pkg.tar.zst
